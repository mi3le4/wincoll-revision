  $('#pwa10').onclick=()=>{for(let i=0;i<10;i++)W.rows.push({q:'Q'+(W.rows.length+1),m:'',g:'',t:'',n:''});save();rows()};
  $('#pwr').oninput=e=>{const r=e.target.closest('[data-r]');if(!r)return;const o=W.rows[+r.dataset.r],k=e.target.dataset.k;if(k){o[k]=e.target.value;save();sum()}};
  $('#pwr').onclick=e=>{const x=e.target.closest('[data-x]');if(x){W.rows.splice(+x.dataset.x,1);save();rows()}};
  $('#pwfin').onclick=finish;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#pw').classList.contains('on'))close()});
  (async()=>{for(const k of ['paper','ms']){const f=await idbGet('pdf_'+k);if(f)urls[k]=URL.createObjectURL(f)}view()})();rows();clock()}
function view(){const v=$('#pwv');if(urls[tab]){v.innerHTML=`<iframe title="${tab==='ms'?'Mark scheme':'Question paper'}" src="${urls[tab]}"></iframe><a class="pwo" href="${urls[tab]}" target="_blank" rel="noopener">Open in new tab</a>`}
  else v.innerHTML=`<div class="pwe"><h3>${tab==='ms'?'Add the mark scheme':'Open a past paper'}</h3><p>Press <b>Open PDF…</b> and choose the ${tab==='ms'?'mark scheme':'question paper'} you downloaded. It stays on this device only and is remembered for next time.</p>
   <p>Where to get real Edexcel IGCSE Chemistry (4CH1) papers:</p><p><a href="https://qualifications.pearson.com/en/support/support-topics/exams/past-papers.html" target="_blank" rel="noopener">Pearson past papers page</a><br><a href="https://www.savemyexams.com/igcse/chemistry/edexcel/" target="_blank" rel="noopener">Save My Exams · Edexcel IGCSE Chemistry</a></p>
   <p class="pwn">Check the front cover of your paper for its real time and total marks, then set the minutes above.</p></div>`}
function rows(){$('#pwr').innerHTML=W.rows.length?W.rows.map((r,i)=>`<div class="pwr" data-r="${i}"><input data-k="q" value="${esc(r.q)}" aria-label="Question"><input data-k="m" type="number" min="0" placeholder="out of" value="${esc(r.m)}" aria-label="Marks available"><input data-k="g" type="number" min="0" placeholder="got" value="${esc(r.g)}" aria-label="Marks gained"><select data-k="t" aria-label="Topic"><option value="">Topic…</option>${T.map(t=>`<option value="${t.id}" ${r.t===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select><button class="x" data-x="${i}" title="Remove">×</button><textarea data-k="n" rows="1" placeholder="Your answer / notes">${esc(r.n)}</textarea></div>`).join(''):'<div class="pwe small">Add a row per question. Write your answer, then compare with the mark scheme and enter the marks you earned.</div>';sum()}
function sum(){const t=tot();$('#pwsum').textContent=t.g+' / '+t.a+(t.a?'  ·  '+Math.round(t.g/t.a*100)+'%':'')}
function clock(){clearInterval(tm);const b=$('#pwgo'),t=$('#pwt');const paint=()=>{t.textContent=fm(W.left);t.classList.toggle('low',W.left<600&&W.left>0);b.textContent=W.run?'Pause':(W.left<W.mins*60?'Resume':'Start')};paint();
  if(W.run)tm=setInterval(()=>{W.left--;if(W.left<=0){W.left=0;W.run=false;try{sfx.bad();toast('⏰ Time is up. Finish your answers.')}catch(e){}clearInterval(tm)}save();paint()},1000)}
function finish(){const t=tot();if(!t.a){try{toast('Enter marks available first')}catch(e){}return}
  if(W.done&&!confirm('You already logged this sitting. Log it again?'))return;
  const lost={};S.pp=S.pp||{};W.rows.forEach(r=>{if(!r.t||!+r.m)return;const g=Math.min(+r.g||0,+r.m);const p=S.pp[r.t]||[0,0];S.pp[r.t]=[p[0]+g,p[1]+ +r.m];lost[r.t]=(lost[r.t]||0)+(+r.m-g)});
  const pct=t.g/t.a,xp=Math.round(20+pct*60);W.done=true;W.run=false;save();clock();addXP(xp);if(pct>=.7)confetti(160);
  const wk=Object.entries(lost).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,4);
  $('#pwres').innerHTML=`<b>${t.g} / ${t.a} · ${Math.round(pct*100)}%</b> · +${xp} XP · logged to your weakest-topics tracker.${wk.length?'<div class="pww">Most marks lost:'+wk.map(([k,v])=>` <a href="#" data-go="${k}">${esc(TM[k].title)} (−${v})</a>`).join('')+'</div>':''}`;
  $('#pwres').querySelectorAll('[data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();close();gotoTopic(a.dataset.go)});try{drawPaper()}catch(e){}}
function open(){mount();$('#pw').classList.add('on');document.body.classList.add('pwopen')}
function close(){const p=$('#pw');if(p){p.classList.remove('on');document.body.classList.remove('pwopen')}}
const _dp=drawPaper;drawPaper=function(){_dp.apply(this,arguments);const w=$('#paperWrap');if(!w||w.querySelector('#pwcard'))return;const c=document.createElement('div');c.id='pwcard';c.className='gcard';c.style.cursor='default';
  c.innerHTML=`<span class="big">📄</span><div><h3>Sit a real past paper</h3><p>Open an actual Edexcel IGCSE Chemistry paper and mark scheme (PDF you download) beside a timer, answer pad and self-marking. Marks feed your weakest-topics list.</p></div><button class="btn" id="pwopen">Open workbench</button>`;
  w.insertBefore(c,w.children[1]||null);c.querySelector('#pwopen').onclick=open};
if($('#paperWrap'))drawPaper();
})();

</script>
</body>
</html>
