<style>

 -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:12px}

.roll{position:relative;overflow:hidden;height:1.15em}
.roll>span{pointer-events:none;position:absolute;left:0;right:0;transition:transform .8s cubic-bezier(.2,.8,.15,1),opacity .6s,filter .6s}
.roll>span.up{transform:translateY(-110%);opacity:0;filter:blur(6px)}.roll>span.down{transform:translateY(110%);opacity:0;filter:blur(6px)}

#palIn{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:12px 14px;font-size:18px;outline:none}
#palUl{list-style:none;margin:10px 0 0;padding:0;max-height:50vh;overflow:auto}#palUl li{padding:9px 12px;border-radius:7px;cursor:pointer}#palUl li.on{background:rgba(127,127,127,.2)}
#busy{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:var(--bg);font:600 14px ui-monospace,monospace;letter-spacing:.2em;color:var(--mute)}#busy.on{display:grid}
.rig,.ritem,.hud,#np{filter:url(#hubw)}
html.cc,html.cc *{cursor:none!important}html.cc input{cursor:text!important}#ring,#cur{position:fixed;left:0;top:0;z-index:900;pointer-events:none;opacity:0;will-change:transform}#ring{width:34px;height:34px;border:1.5px solid #ffffffd0;border-radius:50%;mix-blend-mode:difference;transition:width .3s cubic-bezier(.2,.9,.3,1),height .3s cubic-bezier(.2,.9,.3,1),background .25s,opacity .2s,border-color .2s}#ring.mag{width:58px;height:58px;background:#ffffff14;border-color:#fff}#ring.down{width:26px;height:26px}#cur{width:6px;height:6px;border-radius:50%;background:#fff;mix-blend-mode:difference}

  o[0]=(1-2*(y*y+z*z))*s[0];o[1]=2*(x*y+z*w)*s[0];o[2]=2*(x*z-y*w)*s[0];o[4]=2*(x*y-z*w)*s[1];o[5]=(1-2*(x*x+z*z))*s[1];o[6]=2*(y*z+x*w)*s[1];

 document.readyState==='loading'?document.addEventListener('DOMContentLoaded',run,{once:true}):run()});

/* ---------- open a subject: rebuild its page and replace this document (same origin, so saved progress works) ---------- */
const ESC='',GLB='';
async function open(id,opts){const S=SUBJ.find(s=>s.id===id);if(!S)return;$('#busy').textContent='OPENING '+S.name.toUpperCase()+'…';$('#busy').classList.add('on');await H.ready;
 const ael=document.getElementById('hub-app-'+id);let html=ael?ael.textContent.split(ESC).join('<'):await (await fetch('assets/apps/'+id+'.html')).text();
 const b64of=async u=>{const b=await (await fetch(u)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)})};
 const parts={};for(const mm of html.matchAll(new RegExp(GLB+'([\\w-]+)'+GLB,'g'))){const k=mm[1],el=document.getElementById('hub-'+k);parts[mm[0]]=[k,el?el.textContent:await b64of('assets/models/'+k+'.glb')]}
 for(const mm of html.matchAll(/\uE003([\w-]+)\|([^\uE003]+)\uE003/g))parts[mm[0]]=[mm[1],await b64of(mm[2])];
 for(const k in parts)html=html.split(k).join('<script type="text/plain" id="'+parts[k][0]+'">'+parts[k][1]+'</scr'+'ipt>');
 alive=false;cancelAnimationFrame(raf);audio.pause();AC.abort();
 try{localStorage.setItem('hub_last',id)}catch(e){}history.replaceState(null,'',location.pathname+location.search+'#'+id);window.__HUBACT=opts||null;
 document.open();document.write(html);document.close()}
H.open=open;H.go=go;

cur=lastS?SUBJ.indexOf(lastS):0;setInfo(cur,1);setProg(cur);ring.forEach(r=>r.shown=cur);MB.subj=cur;setAcc(1);raf=requestAnimationFrame(loop);
const hs=location.hash.slice(1),q=location.search;
if(SUBJ.some(S=>S.id===hs))open(hs);else if(/[?&](code|error)=/.test(q)&&lastS)open(lastS.id);
})();
